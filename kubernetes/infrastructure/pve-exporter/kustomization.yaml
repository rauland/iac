# The Proxmox VE exporter, scraped by kube-prometheus-stack, with alerts for
# the host, its storages and its guests. A cluster's overlay supplies the
# Secret pve-exporter (keys user, token-name, token-value) for a read-only
# PVEAuditor token, and its Flux Kustomization sets pve_host and, optionally,
# pve_ignored_guests. It needs the monitoring stack's CRDs and namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - deployment.yaml
  - service.yaml
  - service-monitor.yaml
  - rules.yaml
# "Proxmox via Prometheus" (grafana.com dashboard 10347, revision 5), with its
# data source set to the chart's Prometheus (uid prometheus). Grafana's
# sidecar loads ConfigMaps labelled grafana_dashboard. Flux must not
# substitute in it: the dashboard's own $instance variables would be emptied.
configMapGenerator:
  - name: pve-exporter-dashboard
    files:
      - proxmox.json=dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
