# One scrape covers the whole host: cluster=1 reads every guest and storage
# from the cluster resources, and node=1 adds each guest's on-boot setting.
# The exporter answers each scrape by calling the Proxmox API, so the scrape
# fails, and up drops to 0, when the API cannot be reached.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pve-exporter
  labels:
    app.kubernetes.io/name: pve-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pve-exporter
  endpoints:
    - port: http
      path: /pve
      params:
        target: ["${pve_host}"]
        cluster: ["1"]
        node: ["1"]
      interval: 60s
      scrapeTimeout: 30s
      relabelings:
        - targetLabel: instance
          replacement: ${pve_host}
