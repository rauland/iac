# One wildcard certificate per cluster, served by Traefik as its default
# certificate (see the Traefik release's tlsStore), so apps need no TLS
# configuration of their own.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard
  namespace: traefik
spec:
  secretName: wildcard-tls
  dnsNames:
    - ${cluster_domain}
    - "*.${cluster_domain}"
  issuerRef:
    kind: ClusterIssuer
    name: ${acme_issuer}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
