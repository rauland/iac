apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: proxmox-csi-plugin
  namespace: csi-proxmox
spec:
  url: oci://ghcr.io/sergelogvinov/charts/proxmox-csi-plugin
  ref:
    tag: 0.5.13
  interval: 24h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-csi-plugin
  namespace: csi-proxmox
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: proxmox-csi-plugin
  values:
    # config.yaml with the Proxmox API URL, token and region; see the
    # cluster's proxmox-csi directory.
    existingConfigSecret: proxmox-csi-plugin
    storageClass:
      - name: proxmox
        storage: ${csi_storage}
        fstype: ext4
        # Keep the disk when its claim is deleted, for example when Flux prunes
        # an app. Free unused disks deliberately; see the Kubernetes README.
        reclaimPolicy: Retain
        volumeBindingMode: WaitForFirstConsumer
        cache: none
        ssd: true
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
        # LUKS-encrypt every volume on the node with the passphrase in the
        # cluster's proxmox-csi-encryption Secret, so Proxmox stores only
        # ciphertext. See the Kubernetes README.
        extraParameters:
          csi.storage.k8s.io/node-stage-secret-name: proxmox-csi-encryption
          csi.storage.k8s.io/node-stage-secret-namespace: csi-proxmox
          csi.storage.k8s.io/node-expand-secret-name: proxmox-csi-encryption
          csi.storage.k8s.io/node-expand-secret-namespace: csi-proxmox
      # For volumes that hold nothing worth keeping, such as VolSync's restic
      # caches, which would otherwise leave a retained disk behind each time
      # their ReplicationSource is removed.
      - name: proxmox-scratch
        storage: ${csi_storage}
        fstype: ext4
        reclaimPolicy: Delete
        volumeBindingMode: WaitForFirstConsumer
        cache: none
        ssd: true
        extraParameters:
          csi.storage.k8s.io/node-stage-secret-name: proxmox-csi-encryption
          csi.storage.k8s.io/node-stage-secret-namespace: csi-proxmox
          csi.storage.k8s.io/node-expand-secret-name: proxmox-csi-encryption
          csi.storage.k8s.io/node-expand-secret-namespace: csi-proxmox
