apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  url: https://traefik.github.io/charts
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 42.1.3
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    service:
      annotations:
        metallb.io/loadBalancerIPs: ${ingress_ip}
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      # A request body must arrive within the read timeout, 60 seconds by
      # default; large uploads, such as phone videos on a slow connection,
      # need longer.
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 600s
    # The cluster's wildcard certificate from cert-manager; until it is issued,
    # Traefik serves its own self-signed certificate.
    tlsStore:
      default:
        defaultCertificate:
          secretName: wildcard-tls
