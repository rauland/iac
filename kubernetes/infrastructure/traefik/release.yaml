apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  url: https://traefik.github.io/charts
  interval: 24h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 42.1.3
      sourceRef:
        kind: HelmRepository
        name: traefik
  values:
    service:
      annotations:
        metallb.io/loadBalancerIPs: ${ingress_ip}
