# Flux reconciles this directory on the prod cluster from main: the platform's
# infrastructure here, and the apps from the private repository that
# homelab-apps.yaml points at.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - infrastructure.yaml
  - homelab-apps-deploy-key.sops.yaml
  - homelab-apps.yaml
