# Applied by the certificates Flux Kustomization with this cluster's
# Cloudflare token; the root kustomization does not list it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infrastructure/certificates
  - cloudflare.sops.yaml
patches:
  # Household-facing apps also answer on short names under the parent domain,
  # which the router points at prod one app at a time. The list replaces the
  # base's names: Let's Encrypt rejects prod.netkuki.com next to *.netkuki.com,
  # which already covers it.
  - target:
      kind: Certificate
      name: wildcard
    patch: |
      - op: replace
        path: /spec/dnsNames
        value:
          - netkuki.com
          - "*.netkuki.com"
          - "*.prod.netkuki.com"
