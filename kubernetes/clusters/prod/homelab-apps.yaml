# Apps live in a separate, private repository; see the Kubernetes README's
# "Apps in a private repository". Flux reads it with a read-only deploy key
# (homelab-apps-deploy-key.sops.yaml) and applies its clusters/prod directory,
# which lists one Flux Kustomization per app.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-apps
  namespace: flux-system
spec:
  url: ssh://git@github.com/rauland/homelab-apps.git
  ref:
    branch: main
  interval: 1m
  secretRef:
    name: homelab-apps-deploy-key
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./clusters/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: homelab-apps
  decryption:
    provider: sops
    secretRef:
      name: sops-age
