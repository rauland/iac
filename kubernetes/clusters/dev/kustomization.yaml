# Flux reconciles this directory on the dev cluster from main. Infrastructure
# and each app are Flux Kustomizations of their own; add apps to apps.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - infrastructure.yaml
  - homelab-apps-deploy-key.sops.yaml
  - homelab-apps.yaml
  - apps.yaml
