---
plugin: community.proxmox.proxmox
url: "{{ lookup('env', 'PROXMOX_URL') }}"
user: "{{ lookup('env', 'PROXMOX_USER') }}"
token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
want_facts: true
exclude_nodes: true
group_prefix: proxmox_
keyed_groups:
  - key: proxmox_tags_parsed
    prefix: tag
    separator: "_"
compose:
  ansible_host: >-
    ((proxmox_ipconfig0 | default({})).ip | default((proxmox_net0 | default({})).ip | default('')))
    | ansible.utils.ipaddr('address')
    or (proxmox_agent_interfaces | default([])
        | rejectattr('name', 'equalto', 'lo') | map(attribute='ip-addresses')
        | flatten | ansible.utils.ipv4('address') | reject('match', '^127[.]')
        | reject('match', '^169[.]254[.]') | first | default(''))
