plugin: community.proxmox.proxmox
url: "{{ lookup('env', 'PROXMOX_URL') }}"
user: "{{ lookup('env', 'PROXMOX_USER') }}"
token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
want_facts: true
exclude_nodes: true
keyed_groups:
  - key: proxmox_tags_parsed
    prefix: tag
    separator: "_"
compose:
  ansible_host: proxmox_ipconfig0.ip | default(proxmox_net0.ip) | ansible.utils.ipaddr('address') or proxmox_agent_interfaces[1]["ip-addresses"][0] | ansible.utils.ipaddr('address')
  # ansible_host: proxmox_agent_interfaces[1]["ip-addresses"][0] | ansible.utils.ipaddr('address')
groups:
  dev: "'dev' in proxmox_tags_parsed"
  prod: "'prod' in proxmox_tags_parsed"
