---
# Each credential is issued by its owner and written straight to the host;
# none is stored in the repository or shown in output.
- name: Split the PBS token ID
  ansible.builtin.set_fact:
    pve_volume_backup_pbs_user: "{{ pve_volume_backup_pbs_token.split('!')[0] }}"
    pve_volume_backup_pbs_token_name: "{{ pve_volume_backup_pbs_token.split('!')[1] }}"

- name: Regenerate the PBS token secret
  ansible.builtin.command:
    argv:
      - proxmox-backup-debug
      - api
      - set
      - /access/users/{{ pve_volume_backup_pbs_user }}/token/{{ pve_volume_backup_pbs_token_name }}
      - --regenerate
      - "true"
      - --output-format
      - json
  delegate_to: "{{ pve_volume_backup_pbs_host }}"
  register: pve_volume_backup_pbs_secret
  changed_when: true
  no_log: true
  when: "'pbs-token' in pve_volume_backup_issue"

- name: Write the PBS token secret
  ansible.builtin.copy:
    content: "{{ pve_volume_backup_pbs_reply['secret'] | default(pve_volume_backup_pbs_reply['value']) }}"
    dest: "{{ pve_volume_backup_dir }}/pbs-token"
    owner: root
    group: root
    mode: "0600"
  vars:
    pve_volume_backup_pbs_reply: "{{ pve_volume_backup_pbs_secret.stdout | from_json }}"
  no_log: true
  when: "'pbs-token' in pve_volume_backup_issue"

- name: Issue a token for the Kubernetes reader
  ansible.builtin.command:
    argv:
      - kubectl
      - --namespace
      - "{{ pve_volume_backup_kube_reader_namespace }}"
      - create
      - token
      - "{{ pve_volume_backup_kube_reader }}"
      - --duration
      - "{{ pve_volume_backup_credential_ttl_hours }}h"
  delegate_to: localhost
  become: false
  register: pve_volume_backup_kube_token
  changed_when: true
  no_log: true
  when: "'kube-token' in pve_volume_backup_issue"

- name: Read the Kubernetes API certificate authority
  ansible.builtin.command:
    argv:
      - kubectl
      - config
      - view
      - --raw
      - --minify
      - --output
      - jsonpath={.clusters[0].cluster.certificate-authority-data}
  delegate_to: localhost
  become: false
  register: pve_volume_backup_kube_ca
  changed_when: false
  when: "'kube-token' in pve_volume_backup_issue"

- name: Write the Kubernetes credentials
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ pve_volume_backup_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - name: kube-token
      content: "{{ pve_volume_backup_kube_token.stdout }}"
    - name: kube-ca.crt
      content: "{{ pve_volume_backup_kube_ca.stdout | b64decode }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: "'kube-token' in pve_volume_backup_issue"

- name: Issue the etcd-backup Talos credential
  when: "'talosconfig' in pve_volume_backup_issue"
  block:
    - name: Create a temporary file for the Talos credential
      ansible.builtin.tempfile:
        suffix: .talosconfig
      delegate_to: localhost
      become: false
      register: pve_volume_backup_talos_temp

    - name: Issue the credential with only the os:etcd:backup role
      ansible.builtin.command:
        argv:
          - talosctl
          - --nodes
          - "{{ pve_volume_backup_talos_node }}"
          - config
          - new
          - --roles
          - os:etcd:backup
          - --crt-ttl
          - "{{ pve_volume_backup_credential_ttl_hours }}h"
          - "{{ pve_volume_backup_talos_temp.path }}"
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Write the Talos credential
      ansible.builtin.copy:
        src: "{{ pve_volume_backup_talos_temp.path }}"
        dest: "{{ pve_volume_backup_dir }}/talosconfig"
        owner: root
        group: root
        mode: "0600"
  always:
    - name: Remove the local copy of the Talos credential
      ansible.builtin.file:
        path: "{{ pve_volume_backup_talos_temp.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: pve_volume_backup_talos_temp.path is defined
