---
# Shared Vault user, storage, TLS, and service configuration.
# Dedicated vault user and directories
- name: Create Vault system user
  ansible.builtin.user:
    name: vault
    system: true
    home: /etc/vault.d
    shell: /bin/false
    create_home: false

- name: Create Vault directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: vault
    group: vault
    mode: "0755"
  loop:
    - /opt/vault/data
    - /etc/vault.d/ssl
    - /var/log/vault

- name: Set Vault base directory permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: vault
    group: vault
    mode: "0755"
  loop:
    - /opt/vault
    - /etc/vault.d

- name: Create Certbot credentials directory
  ansible.builtin.file:
    path: /root/.secrets/certbot
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install Cloudflare API credentials
  ansible.builtin.copy:
    content: |
      dns_cloudflare_api_token = {{ lookup('env', 'CLOUDFLARE_API_TOKEN') }}
    dest: /root/.secrets/certbot/cloudflare.ini
    owner: root
    group: root
    mode: "0600"
  no_log: true

# Configure TLS Certificates
- name: Set Vault SSL directory ownership
  ansible.builtin.file:
    path: /etc/vault.d/ssl
    state: directory
    owner: vault
    group: vault
    recurse: true

- name: Obtain Vault TLS certificate
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --dns-cloudflare
      - --dns-cloudflare-credentials
      - /root/.secrets/certbot/cloudflare.ini
      - --non-interactive
      - --agree-tos
      - --email
      - "{{ certbot_email }}"
      - -d
      - "{{ vault_api_addr }}"
  args:
    creates: /etc/letsencrypt/live/{{ vault_api_addr }}/fullchain.pem

- name: Install Vault TLS certificate
  ansible.builtin.copy:
    src: /etc/letsencrypt/live/{{ vault_api_addr }}/fullchain.pem
    dest: /etc/vault.d/ssl/tls.crt
    remote_src: true
    owner: vault
    group: vault
    mode: "0644"
  notify: Restart Vault

- name: Install Vault TLS private key
  ansible.builtin.copy:
    src: /etc/letsencrypt/live/{{ vault_api_addr }}/privkey.pem
    dest: /etc/vault.d/ssl/tls.key
    remote_src: true
    owner: vault
    group: vault
    mode: "0600"
  notify: Restart Vault

# Configure Vault service
- name: Deploy Vault configuration
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: /etc/vault.d/vault.hcl
    owner: vault
    group: vault
    mode: "0640"
  notify: Restart Vault

- name: Install Vault systemd service
  ansible.builtin.template:
    src: vault.service.j2
    dest: /etc/systemd/system/vault.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Vault

- name: Enable and start Vault
  ansible.builtin.systemd:
    name: vault
    enabled: true
    state: started
    daemon_reload: true
