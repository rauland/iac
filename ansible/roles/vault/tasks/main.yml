---
- name: Require a supported OS family for Vault
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
    fail_msg: >-
      The Vault role currently supports only RHEL-family hosts with DNF and EPEL
      (the repository provisions AlmaLinux). Add OS-specific tasks before
      targeting {{ ansible_facts['os_family'] }} hosts.

- name: Install Vault prerequisites for RHEL-family hosts
  ansible.builtin.import_tasks: RedHat.yml
  when: ansible_facts['os_family'] == 'RedHat'

- name: Configure Vault
  ansible.builtin.import_tasks: common.yml
