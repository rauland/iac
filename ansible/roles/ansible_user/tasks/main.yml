---
# tasks file for ansible_user
- name: Require the requested environment's pool
  ansible.builtin.assert:
    that:
      - ansible_user_environment in ['dev', 'prod']
      - inventory_hostname in groups.get('proxmox_pool_' ~ ansible_user_environment, [])
    fail_msg: "SSH access must be configured only for the selected environment's pool."

- name: Ensure ansible user exists
  ansible.builtin.user:
    name: "{{ ansible_user_name }}"
    shell: "{{ ansible_user_shell }}"
    groups: "{{ ansible_user_groups | default(omit, true) }}"
    home: "{{ ansible_user_home }}"
    state: present
    create_home: yes

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_home }}/.ssh"
    state: directory
    owner: "{{ ansible_user_name }}"
    group: "{{ ansible_user_name }}"
    mode: '0700'

- name: Set authorized key for ansible user
  ansible.posix.authorized_key:
    user: "{{ ansible_user_name }}"
    key: "{{ ansible_user_ssh_key }}"
    state: present
    key_options: "no-agent-forwarding,no-port-forwarding,no-X11-forwarding"

- name: Remove retired and other-environment automation keys
  ansible.posix.authorized_key:
    user: "{{ ansible_user_name }}"
    key: "{{ item }}"
    state: absent
  loop: "{{ ansible_user_retired_ssh_keys }}"
  when: ansible_user_remove_retired_keys | bool
