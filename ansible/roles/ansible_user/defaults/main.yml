---
# defaults file for ansible_user
ansible_user_name: ansible
ansible_user_shell: /bin/bash
ansible_user_home: "/home/{{ ansible_user_name }}"
ansible_user_groups: []
ansible_user_environment: "{{ lookup('env', 'ANSIBLE_ENVIRONMENT') }}"
ansible_user_ssh_key: "{{ lookup('file', playbook_dir ~ '/../../ssh/public_keys/' ~ ansible_user_environment ~ '/ansible-ci.pub') }}"
ansible_user_remove_retired_keys: true
ansible_user_retired_ssh_keys:
  - "{{ lookup('file', playbook_dir ~ '/../../ssh/public_keys/retired/ansible-shared.pub') }}"
  - "{{ lookup('file', playbook_dir ~ '/../../ssh/public_keys/' ~ ('prod' if ansible_user_environment == 'dev' else 'dev') ~ '/ansible-ci.pub') }}"
