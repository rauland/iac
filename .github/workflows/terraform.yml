name: Terraform Actions

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (e.g., dev, prod)"
        required: true
        type: choice
        options:
          - dev
          - prod
      target:
        description: "Target to deploy (e.g., images, vault)"
        required: true
        type: choice
        options:
          - images
          - k3s
          - talos
          - vault
      destroy:
        description: "Destroy resources"
        required: true
        default: false
        type: boolean

  pull_request:
    branches: [main]
    paths: &paths
      - "terraform/modules/**"
      - "terraform/environments/**"
      - ".github/workflows/terraform.yml"

  push:
    branches: [main]
    paths: *paths

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        environment: &environment
          - ${{ inputs.environment || fromJSON('["prod"]') }}
        target: &target
          - ${{ inputs.target || fromJSON('["images"]') }}
    outputs:
      plan-success: ${{ steps.plan.outputs.success }}
    environment: proxmox-ro
    env: &common-env
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
      PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
      PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
      PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
      TF_VAR_virtual_environment_endpoint: ${{ secrets.TF_VAR_VIRTUAL_ENVIRONMENT_ENDPOINT }}
      TF_VAR_virtual_environment_api_token: ${{ secrets.TF_VAR_VIRTUAL_ENVIRONMENT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - uses: ./.github/actions/wireguard
        with: &wireguard-env
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          RUNNER_IP: ${{ secrets.RUNNER_IP }}
          PEER_IP: ${{ secrets.PEER_IP }}
          WIREGUARD_PEER_PUBLIC_KEY: ${{ secrets.WIREGUARD_PEER_PUBLIC_KEY }}
          WIREGUARD_ENDPOINT: ${{ secrets.WIREGUARD_ENDPOINT }}

      - run: terraform init -backend-config="key=terraform/${{ matrix.environment }}/${{ matrix.target }}.tfstate"
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}

      - name: Plan
        run: terraform plan -lock=false --input=false ${{ inputs.destroy == true && '-destroy' || '' }}

        id: plan
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}

  apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.destroy == false
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        environment: *environment
        target: *target
    environment: proxmox-rw
    env: *common-env

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: ./.github/actions/wireguard
        with: *wireguard-env

      - run: terraform init -backend-config="key=terraform/${{ matrix.environment }}/${{ matrix.target }}.tfstate"
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}

      - name: Apply
        run: terraform apply -auto-approve --input=false
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}

      - uses: ./.github/actions/ansible
        env:
          PROXMOX_USER: ${{ secrets.PROXMOX_USER_ANSIBLE }}
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID_ANSIBLE }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET_ANSIBLE }}
          PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
        with:
          working-directory: ansible
          SSH_PRIVATE_KEY_ANSIBLE: ${{ secrets.SSH_PRIVATE_KEY_ANSIBLE }}
          target: ${{ matrix.target }}
          environment: ${{ inputs.environment }}

  destroy:
    name: Terraform Destroy
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.destroy == true
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        environment: *environment
        target: *target
    environment: proxmox-rw
    env: *common-env

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: ./.github/actions/wireguard
        with: *wireguard-env

      - run: terraform init -backend-config="key=terraform/${{ matrix.environment }}/${{ matrix.target }}.tfstate"
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}

      - name: Destroy
        run: terraform destroy -auto-approve --input=false
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}

