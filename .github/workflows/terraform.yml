name: Terraform Actions

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Which Terraform roots to plan and apply"
        type: choice
        options:
          - single
          - all
        default: single
        required: true
      environment:
        description: "Environment to deploy (e.g., dev, prod)"
        required: true
        type: choice
        options:
          - dev
          - prod
      target:
        description: "Target to deploy (e.g., images, vault)"
        required: true
        type: choice
        options:
          - images
          - k3s
          - sandbox
          - talos
          - vault
      destroy:
        description: "Destroy resources"
        required: true
        default: false
        type: boolean

  pull_request:
    branches: [main]
    paths: &paths
      - "terraform/modules/**"
      - "terraform/environments/**"
      - ".github/workflows/terraform.yml"

  push:
    branches: [main]
    paths: *paths

jobs:
  discover:
    name: Discover Terraform roots
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.roots.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Discover deployment targets
        id: roots
        env:
          MODE: ${{ inputs.deployment_mode || 'single' }}
          SELECTED_ENV: ${{ inputs.environment || 'prod' }}
          SELECTED_TARGET: ${{ inputs.target || 'images' }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT="terraform/environments"
          MATRIX='[]'

          if [[ "$MODE" == "all" ]]; then
            MATRIX=$(
              for env_dir in "$ROOT"/*/; do
                [[ -d "$env_dir" ]] || continue

                for target_dir in "$env_dir"/*/; do
                  [[ -d "$target_dir" ]] || continue

                  # Only include directories with Terraform files directly inside.
                  if find "$target_dir" \
                    -maxdepth 1 \
                    -type f \
                    -name '*.tf' \
                    -print -quit | grep -q .; then

                    jq -cn \
                      --arg environment "$(basename "$env_dir")" \
                      --arg target "$(basename "$target_dir")" \
                      '{environment: $environment, target: $target}'
                  fi
                done
              done | jq -sc .
            )
          else
            dir="$ROOT/$SELECTED_ENV/$SELECTED_TARGET"

            if [[ ! -d "$dir" ]] ||
              ! find "$dir" \
                -maxdepth 1 \
                -type f \
                -name '*.tf' \
                -print -quit | grep -q .; then
              echo "::error::No Terraform root found at $dir"
              exit 1
            fi

            MATRIX=$(
              jq -cn \
                --arg environment "$SELECTED_ENV" \
                --arg target "$SELECTED_TARGET" \
                '[{environment: $environment, target: $target}]'
            )
          fi

          if [[ "$MATRIX" == "[]" ]]; then
            echo "::error::No Terraform roots discovered in $ROOT"
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Discovered Terraform roots: $MATRIX"
  plan:
    name: Terraform Plan
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    outputs:
      plan-success: ${{ steps.plan.outputs.success }}
    environment: proxmox-ro
    env: &common-env
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
      PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
      PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
      PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
      TF_VAR_virtual_environment_endpoint: ${{ secrets.TF_VAR_VIRTUAL_ENVIRONMENT_ENDPOINT }}
      TF_VAR_virtual_environment_api_token: ${{ secrets.TF_VAR_VIRTUAL_ENVIRONMENT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - uses: ./.github/actions/wireguard
        with: &wireguard-env
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          RUNNER_IP: ${{ secrets.RUNNER_IP }}
          PEER_IP: ${{ secrets.PEER_IP }}
          WIREGUARD_PEER_PUBLIC_KEY: ${{ secrets.WIREGUARD_PEER_PUBLIC_KEY }}
          WIREGUARD_ENDPOINT: ${{ secrets.WIREGUARD_ENDPOINT }}

      - run: terraform init -backend-config="key=terraform/${{ matrix.environment }}/${{ matrix.target }}.tfstate"
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}

      - name: Plan
        run: terraform plan -lock=false --input=false ${{ inputs.destroy == true && '-destroy' || '' }}

        id: plan
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}

  apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.destroy == false
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    environment: proxmox-rw
    env: *common-env

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: ./.github/actions/wireguard
        with: *wireguard-env

      - run: terraform init -backend-config="key=terraform/${{ matrix.environment }}/${{ matrix.target }}.tfstate"
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}

      - name: Apply
        run: terraform apply -auto-approve --input=false
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}

      - uses: ./.github/actions/ansible
        env:
          PROXMOX_USER: ${{ secrets.PROXMOX_USER_ANSIBLE }}
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID_ANSIBLE }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET_ANSIBLE }}
          PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
        with:
          working-directory: ansible
          SSH_PRIVATE_KEY_ANSIBLE: ${{ secrets.SSH_PRIVATE_KEY_ANSIBLE }}
          target: ${{ matrix.target }}
          environment: ${{ matrix.environment }}

  destroy:
    name: Terraform Destroy
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.destroy == true
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    environment: proxmox-rw
    env: *common-env

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - uses: ./.github/actions/wireguard
        with: *wireguard-env

      - run: terraform init -backend-config="key=terraform/${{ matrix.environment }}/${{ matrix.target }}.tfstate"
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}

      - name: Destroy
        run: terraform destroy -auto-approve --input=false
        working-directory: ./terraform/environments/${{ matrix.environment }}/${{ matrix.target }}
