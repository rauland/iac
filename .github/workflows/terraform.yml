name: Terraform Actions

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Which Terraform roots to plan and apply"
        type: choice
        options:
          - single
          - all
        default: single
        required: true
      environment:
        description: "Scope to deploy (dev, prod, platform)"
        required: true
        type: choice
        options:
          - dev
          - prod
          - platform
      target:
        description: "Target to deploy in single mode (ignored in all mode)"
        required: true
        type: choice
        options:
          - images
          - sandbox
          - talos
          - vault
      destroy:
        description: "Destroy resources"
        required: true
        default: false
        type: boolean

  pull_request:
    branches: [main]
    paths: &paths
      - "terraform/modules/**"
      - "terraform/workloads/**"
      - "terraform/platform/**"
      - ".github/workflows/terraform.yml"
      - ".github/scripts/**"
      - ".github/actions/**"
      - "ssh/**"
      - "ansible/**"

  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  access_checks:
    name: Proxmox RBAC tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test SSH credential handling
        run: python3 ssh/test_setup_ci.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ansible inventory test dependencies
        run: |
          pip install ansible requests netaddr
          ansible-galaxy collection install -r ansible/requirements.yml --force
      - name: Test scoped inventory and playbook selection
        run: python3 -m unittest discover -s ansible/tests -p 'test_*.py'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Initialize access providers
        run: terraform init -backend=false -input=false
        working-directory: terraform/platform/access
      - name: Validate access configuration
        run: terraform validate -no-color
        working-directory: terraform/platform/access
      - name: Test environment boundaries
        run: terraform test -no-color
        working-directory: terraform/platform/access

  talos_checks:
    name: Talos module tests (offline)
    needs: discover
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON(needs.discover.outputs.matrix).*.target, 'talos')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Initialize module providers
        run: terraform init -backend=false -input=false
        working-directory: terraform/modules/talos-cluster
      - name: Validate module
        run: terraform validate -no-color
        working-directory: terraform/modules/talos-cluster
      - name: Run offline cluster tests
        run: terraform test -no-color
        working-directory: terraform/modules/talos-cluster
      - name: Test upgrade ordering
        run: python3 terraform/modules/talos-cluster/scripts/test_upgrade_node.py

  discover:
    name: Discover Terraform roots
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.roots.outputs.matrix }}
      has-changes: ${{ steps.roots.outputs.has-changes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test deployment discovery
        run: python3 .github/scripts/test_terraform_roots.py

      - name: Discover deployment targets
        id: roots
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          SELECTED_ENV: ${{ inputs.environment }}
          SELECTED_TARGET: ${{ inputs.target }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/terraform-roots.py

  plan:
    name: Terraform Plan
    if: >-
      !cancelled() &&
      needs.discover.result == 'success' &&
      needs.access_checks.result == 'success' &&
      needs.discover.outputs.has-changes == 'true' &&
      (needs.talos_checks.result == 'success' || needs.talos_checks.result == 'skipped')
    needs: [discover, talos_checks, access_checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    environment: ${{ format('proxmox-{0}-plan', matrix.environment) }}
    env: &common-env
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      TF_CLI_ARGS_init: ${{ vars.TF_CLI_ARGS_init }}
      PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
      TF_VAR_virtual_environment_endpoint: ${{ secrets.TF_VAR_VIRTUAL_ENVIRONMENT_ENDPOINT }}
      TF_VAR_virtual_environment_api_token: ${{ secrets.TF_VAR_VIRTUAL_ENVIRONMENT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with: &terraform-setup
          terraform_version: "1.15.8"

      - uses: ./.github/actions/wireguard
        with: &wireguard-env
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          RUNNER_IP: ${{ secrets.RUNNER_IP }}
          PEER_IP: ${{ secrets.PEER_IP }}
          WIREGUARD_PEER_PUBLIC_KEY: ${{ secrets.WIREGUARD_PEER_PUBLIC_KEY }}
          WIREGUARD_ENDPOINT: ${{ secrets.WIREGUARD_ENDPOINT }}

      - name: Initialize Terraform backend
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="key=terraform/${{ matrix.environment }}/${{ matrix.target }}.tfstate"
        working-directory: ./${{ matrix.directory }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate Terraform configuration
        run: terraform validate -no-color
        working-directory: ./${{ matrix.directory }}

      - name: Plan
        run: terraform plan -lock=false -input=false -out=tfplan ${{ inputs.destroy == true && '-destroy' || '' }}
        working-directory: ./${{ matrix.directory }}

      - name: Encrypt saved plan
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          TF_PLAN_PUBLIC_KEY: ${{ vars.TF_PLAN_PUBLIC_KEY }}
        run: bash .github/scripts/terraform-plan-artifact.sh encrypt "${{ matrix.directory }}" "$RUNNER_TEMP/tfplan.tar.gpg"

      - name: Upload encrypted plan
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.environment }}-${{ matrix.target }}
          path: ${{ runner.temp }}/tfplan.tar.gpg
          if-no-files-found: error
          retention-days: 7

  apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.destroy == false))
    needs: [discover, plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: terraform-state-${{ matrix.environment }}-${{ matrix.target }}
      cancel-in-progress: false
    environment: ${{ format('proxmox-{0}-apply', matrix.environment) }}
    env: *common-env

    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.environment }}-${{ matrix.target }}
          path: ${{ runner.temp }}/encrypted-plan

      - name: Decrypt saved plan
        env:
          TF_PLAN_PRIVATE_KEY: ${{ secrets.TF_PLAN_PRIVATE_KEY }}
        run: bash .github/scripts/terraform-plan-artifact.sh decrypt "${{ matrix.directory }}" "$RUNNER_TEMP/encrypted-plan/tfplan.tar.gpg"

      - uses: hashicorp/setup-terraform@v3
        with: *terraform-setup

      - uses: ./.github/actions/wireguard
        with: *wireguard-env

      - name: Initialize Terraform backend
        shell: bash
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="key=terraform/${{ matrix.environment }}/${{ matrix.target }}.tfstate"
        working-directory: ./${{ matrix.directory }}

      - name: Apply
        run: terraform apply -input=false tfplan
        working-directory: ./${{ matrix.directory }}

      - uses: ./.github/actions/ansible
        if: matrix.target != 'images' && matrix.target != 'talos'
        env:
          PROXMOX_USER: ${{ secrets.PROXMOX_USER_ANSIBLE }}
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID_ANSIBLE }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET_ANSIBLE }}
          PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          working-directory: ansible
          SSH_PRIVATE_KEY_ANSIBLE: ${{ secrets.SSH_PRIVATE_KEY_ANSIBLE }}
          target: ${{ matrix.target }}
          environment: ${{ matrix.environment }}

  destroy:
    name: Terraform Destroy
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.destroy == true
    needs: [discover, plan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: terraform-state-${{ matrix.environment }}-${{ matrix.target }}
      cancel-in-progress: false
    environment: ${{ format('proxmox-{0}-apply', matrix.environment) }}
    env: *common-env

    steps:
      - uses: actions/checkout@v4

      - name: Download encrypted plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.environment }}-${{ matrix.target }}
          path: ${{ runner.temp }}/encrypted-plan

      - name: Decrypt saved plan
        env:
          TF_PLAN_PRIVATE_KEY: ${{ secrets.TF_PLAN_PRIVATE_KEY }}
        run: bash .github/scripts/terraform-plan-artifact.sh decrypt "${{ matrix.directory }}" "$RUNNER_TEMP/encrypted-plan/tfplan.tar.gpg"

      - uses: hashicorp/setup-terraform@v3
        with: *terraform-setup

      - uses: ./.github/actions/wireguard
        with: *wireguard-env

      - name: Initialize Terraform backend
        shell: bash
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="key=terraform/${{ matrix.environment }}/${{ matrix.target }}.tfstate"
        working-directory: ./${{ matrix.directory }}

      - name: Destroy
        run: terraform apply -input=false tfplan
        working-directory: ./${{ matrix.directory }}
