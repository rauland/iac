name: Infrastructure and configuration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      mode:
        description: Work to perform (auto reconciles infrastructure and configuration)
        type: choice
        options: [auto, infrastructure, configuration, destroy]
        default: auto
        required: true
      scope:
        description: Select one target or all enabled targets in the environment
        type: choice
        options: [single, all]
        default: single
        required: true
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod, platform]
        required: true
      target:
        description: Target (ignored when scope is all)
        type: choice
        options: [common, sandbox, talos, images]
        default: sandbox
        required: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover deployment work
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      plan-matrix: ${{ steps.targets.outputs.plan-matrix }}
      has-plans: ${{ steps.targets.outputs.has-plans }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test deployment routing and saved plans
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          node --test .github/scripts/test_comment_plans.js
      - name: Select infrastructure and configuration targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_MODE: ${{ inputs.mode }}
          DEPLOYMENT_SCOPE: ${{ inputs.scope }}
          SELECTED_ENV: ${{ inputs.environment }}
          SELECTED_TARGET: ${{ inputs.target }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: python3 .github/scripts/deployment-targets.py

  ansible_lint:
    name: Ansible lint (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ansible-lint

  access_checks:
    name: Proxmox RBAC tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible inventory test dependencies
        run: |
          pip install ansible requests netaddr -r terraform/modules/virtual-machine/scripts/requirements.txt
          ansible-galaxy collection install -r ansible/requirements.yml --force
      - name: Test cloud-init seed generation and agent policy
        run: python3 -m unittest discover -s terraform/modules/virtual-machine/tests -p 'test_*.py'
      - name: Test SSH credentials and host enrollment
        run: python3 -m unittest discover -s ssh -p 'test_*.py'
      - name: Test scoped inventory and playbook selection
        run: python3 -m unittest discover -s ansible/tests -p 'test_*.py'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Initialize access providers
        run: terraform init -backend=false -input=false
        working-directory: terraform/platform/access
      - name: Validate access configuration
        run: terraform validate -no-color
        working-directory: terraform/platform/access
      - name: Test environment boundaries
        run: terraform test -no-color
        working-directory: terraform/platform/access
      - name: Initialize VM module providers
        run: terraform init -backend=false -input=false
        working-directory: terraform/modules/virtual-machine
      - name: Test pool-scoped VM tag staging
        run: terraform test -no-color
        working-directory: terraform/modules/virtual-machine

  talos_checks:
    name: Talos module tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Initialize module providers
        run: terraform init -backend=false -input=false
        working-directory: terraform/modules/talos-cluster
      - name: Validate module
        run: terraform validate -no-color
        working-directory: terraform/modules/talos-cluster
      - name: Run offline cluster tests
        run: terraform test -no-color
        working-directory: terraform/modules/talos-cluster
      - name: Test upgrade ordering
        run: python3 terraform/modules/talos-cluster/scripts/test_upgrade_node.py

  terraform_validate:
    name: Terraform format and validation
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate selected roots without backend credentials
        env:
          TARGETS_JSON: ${{ needs.discover.outputs.plan-matrix }}
        run: |
          while IFS= read -r directory; do
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate -no-color
          done < <(jq -r '.[].directory' <<< "$TARGETS_JSON")

  ci:
    name: CI
    if: always()
    needs: [discover, ansible_lint, access_checks, talos_checks, terraform_validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['NEEDS_JSON'])
          failed = [name for name, result in results.items() if result['result'] != 'success']
          if failed:
              raise SystemExit('Required checks did not succeed: ' + ', '.join(failed))
          print('All required checks passed.')
          PYCODE

  plan:
    name: Terraform preview
    needs: [discover, ci]
    if: >-
      needs.discover.outputs.has-plans == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.plan-matrix) }}
    # Each job joins the tailnet as its own node, so only runs touching the same
    # Terraform root need to wait for each other.
    concurrency:
      group: iac-terraform-${{ matrix.environment }}-${{ matrix.target }}
      cancel-in-progress: false
    environment: ${{ format('proxmox-{0}-plan', matrix.environment) }}
    permissions:
      contents: read
      id-token: write
    env: &terraform-env
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      TF_CLI_ARGS_init: ${{ vars.TF_CLI_ARGS_init }}
    steps:
      - uses: actions/checkout@v4
      - name: Assume scoped AWS state role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      # Masks each secret before exporting it; see .github/scripts/load-parameters.py.
      - name: Load CI parameters
        env:
          SCOPE: ${{ matrix.environment }}
        run: python3 .github/scripts/load-parameters.py /iac/shared/proxmox "/iac/$SCOPE/plan"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cloud-init ISO builder
        run: pip install -r terraform/modules/virtual-machine/scripts/requirements.txt
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - uses: ./.github/actions/tailscale
        with: &tailscale-env
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
      - name: Initialize Terraform backend
        env:
          STATE_KEY: terraform/${{ matrix.environment }}/${{ matrix.target }}.tfstate
        run: terraform init -input=false -backend-config="key=$STATE_KEY"
        working-directory: ./${{ matrix.directory }}
      - name: Create saved plan and record actual changes
        id: plan
        env:
          TARGET_DIRECTORY: ${{ matrix.directory }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          TARGET_NAME: ${{ matrix.target }}
          DESTROY: ${{ matrix.destroy }}
        run: |
          python3 .github/scripts/terraform-plan.py \
            --directory "$TARGET_DIRECTORY" --environment "$TARGET_ENVIRONMENT" \
            --target "$TARGET_NAME" --destroy "$DESTROY" \
            --result "$RUNNER_TEMP/plan-result/$TARGET_ENVIRONMENT--$TARGET_NAME.json"
      - name: Upload non-secret plan result
        uses: actions/upload-artifact@v4
        with:
          name: tf-result-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.environment }}-${{ matrix.target }}
          path: ${{ runner.temp }}/plan-result/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Encrypt saved plan when changes exist
        if: >-
          steps.plan.outputs.changes == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          TF_PLAN_PUBLIC_KEY: ${{ vars.TF_PLAN_PUBLIC_KEY }}
          TARGET_DIRECTORY: ${{ matrix.directory }}
        run: bash .github/scripts/terraform-plan-artifact.sh encrypt "$TARGET_DIRECTORY" "$RUNNER_TEMP/tfplan.tar.gpg"
      - name: Upload encrypted plan
        if: >-
          steps.plan.outputs.changes == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.environment }}-${{ matrix.target }}
          path: ${{ runner.temp }}/tfplan.tar.gpg
          if-no-files-found: error
          retention-days: 7

  prepare:
    name: Prepare deployment approval summary
    concurrency:
      group: iac-plan-comment-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    needs: [discover, ci, plan]
    if: >-
      always() && needs.ci.result == 'success' && needs.discover.result == 'success' &&
      (needs.discover.outputs.has-plans == 'false' || needs.plan.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.deployments.outputs.matrix }}
      has-deployments: ${{ steps.deployments.outputs.has-deployments }}
    steps:
      - uses: actions/checkout@v4
      - name: Download plan results for this run attempt
        if: needs.discover.outputs.has-plans == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: tf-result-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/plan-results
          merge-multiple: true
      - name: Select only targets needing deployment
        id: deployments
        env:
          TARGETS_JSON: ${{ needs.discover.outputs.matrix }}
          PLAN_RESULTS_DIRECTORY: ${{ runner.temp }}/plan-results
          PLAN_COMMENT_PATH: ${{ runner.temp }}/plan-comment.md
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_MODE: ${{ inputs.mode }}
        run: python3 .github/scripts/prepare-deployments.py
      - name: Update pull request plan preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        env:
          PLAN_COMMENT_PATH: ${{ runner.temp }}/plan-comment.md
        with:
          script: |
            const commentPlans = require('./.github/scripts/comment-plans.js');
            await commentPlans({ github, context, core });

  deploy:
    name: Deploy
    needs: [ci, prepare]
    if: >-
      always() && needs.ci.result == 'success' && needs.prepare.result == 'success' &&
      needs.prepare.outputs.has-deployments == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    # Each job joins the tailnet as its own node, so only runs touching the same
    # Terraform root need to wait for each other.
    concurrency:
      group: iac-terraform-${{ matrix.environment }}-${{ matrix.target }}
      cancel-in-progress: false
    environment: ${{ matrix.approval_environment }}
    permissions:
      contents: read
      id-token: write
    env: *terraform-env
    steps:
      - uses: actions/checkout@v4
      - name: Assume scoped AWS state role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}
      # Masks each secret before exporting it; see .github/scripts/load-parameters.py.
      - name: Load CI parameters
        env:
          SCOPE: ${{ matrix.environment }}
        run: |
          paths=(/iac/shared/proxmox /iac/shared/apply "/iac/$SCOPE/apply")
          if [ "$SCOPE" != platform ]; then paths+=("/iac/$SCOPE/ansible"); fi
          python3 .github/scripts/load-parameters.py "${paths[@]}"
      - uses: actions/setup-python@v5
        if: matrix.terraform
        with:
          python-version: "3.12"
      - name: Install cloud-init ISO builder
        if: matrix.terraform
        run: pip install -r terraform/modules/virtual-machine/scripts/requirements.txt
      - name: Download encrypted saved plan
        if: matrix.terraform
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.environment }}-${{ matrix.target }}
          path: ${{ runner.temp }}/encrypted-plan
      - name: Decrypt saved plan
        if: matrix.terraform
        env:
          TARGET_DIRECTORY: ${{ matrix.directory }}
        run: bash .github/scripts/terraform-plan-artifact.sh decrypt "$TARGET_DIRECTORY" "$RUNNER_TEMP/encrypted-plan/tfplan.tar.gpg"
      - uses: hashicorp/setup-terraform@v3
        if: matrix.terraform || matrix.ansible
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - uses: ./.github/actions/tailscale
        with: *tailscale-env
      - name: Initialize Terraform with the reviewed dependency selections
        if: matrix.terraform
        env:
          STATE_KEY: terraform/${{ matrix.environment }}/${{ matrix.target }}.tfstate
        run: terraform init -input=false -lockfile=readonly -backend-config="key=$STATE_KEY"
        working-directory: ./${{ matrix.directory }}
      - name: Apply the saved infrastructure or destroy plan
        if: matrix.terraform
        env:
          TARGET_DIRECTORY: ${{ matrix.directory }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          TARGET_NAME: ${{ matrix.target }}
          DESTROY: ${{ matrix.destroy }}
        run: |
          python3 .github/scripts/terraform-apply.py \
            --directory "$TARGET_DIRECTORY" --environment "$TARGET_ENVIRONMENT" \
            --target "$TARGET_NAME" --destroy "$DESTROY"
      - name: Configure selected guests
        if: matrix.ansible
        uses: ./.github/actions/ansible
        env:
          PROXMOX_USER: ${{ env.PROXMOX_USER_ANSIBLE }}
          PROXMOX_TOKEN_ID: ${{ env.PROXMOX_TOKEN_ID_ANSIBLE }}
          PROXMOX_TOKEN_SECRET: ${{ env.PROXMOX_TOKEN_SECRET_ANSIBLE }}
        with:
          working-directory: ansible
          SSH_PRIVATE_KEY_ANSIBLE: ${{ env.SSH_PRIVATE_KEY_ANSIBLE }}
          target: ${{ matrix.target }}
          environment: ${{ matrix.environment }}
