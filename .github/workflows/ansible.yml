name: Ansible run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (e.g., dev, prod)"
        required: true
        type: choice
        options:
          - dev
          - prod
      target:
        description: "Target to deploy (e.g., managed, sandbox, vault)"
        required: true
        type: choice
        options:
          - managed
          - sandbox
          - vault
  # push:
    # branches: [main]
    # paths:
      # - "ansible/**"

jobs:
  run:
    name: Ansible run
    runs-on: ubuntu-latest
    environment: ${{ format('proxmox-{0}-apply', inputs.environment) }}
    steps:
      - name: Require configured RBAC environment
        env:
          RBAC_READY: ${{ vars.PROXMOX_RBAC_READY }}
        run: test "$RBAC_READY" = true

      - uses: actions/checkout@v4

      - uses: ./.github/actions/wireguard
        with:
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
          RUNNER_IP: ${{ secrets.RUNNER_IP }}
          PEER_IP: ${{ secrets.PEER_IP }}
          WIREGUARD_PEER_PUBLIC_KEY: ${{ secrets.WIREGUARD_PEER_PUBLIC_KEY }}
          WIREGUARD_ENDPOINT: ${{ secrets.WIREGUARD_ENDPOINT }}
      
      - uses: ./.github/actions/ansible
        env:
          PROXMOX_USER: ${{ secrets.PROXMOX_USER_ANSIBLE }}
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID_ANSIBLE }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET_ANSIBLE }}
          PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          working-directory: ansible
          SSH_PRIVATE_KEY_ANSIBLE: ${{ secrets.SSH_PRIVATE_KEY_ANSIBLE }}
          target: ${{ inputs.target }}
          environment: ${{ inputs.environment }}
