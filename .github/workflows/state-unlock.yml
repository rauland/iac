name: State Unlock

on:
  workflow_dispatch:
    inputs:
      LOCK_ID:
        description: "Terraform state lock ID to unlock"
        required: true
      environment:
        description: "Environment holding the state to unlock"
        required: true
        type: choice
        options:
          - dev
          - prod
          - platform
      target:
        description: "Target holding the state to unlock"
        required: true
        type: choice
        options:
          - images
          - sandbox
          - talos
          - flux
jobs:
  state_unlock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ format('proxmox-{0}-apply', inputs.environment) }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      TF_CLI_ARGS_init: ${{ vars.TF_CLI_ARGS_init }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume scoped AWS state role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Resolve Terraform root
        id: root
        env:
          EVENT_NAME: workflow_dispatch
          DEPLOYMENT_MODE: infrastructure
          DEPLOYMENT_SCOPE: single
          SELECTED_ENV: ${{ inputs.environment }}
          SELECTED_TARGET: ${{ inputs.target }}
        run: python3 .github/scripts/deployment-targets.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Initialize Terraform backend
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="key=terraform/${{ inputs.environment }}/${{ inputs.target }}.tfstate"
        working-directory: ./${{ steps.root.outputs.directory }}

      - run: terraform force-unlock -force "$LOCK_ID"
        env:
          LOCK_ID: ${{ inputs.LOCK_ID }}
        working-directory: ./${{ steps.root.outputs.directory }}
