name: State Unlock

on:
  workflow_dispatch:
    inputs:
      LOCK_ID:
        description: "Terraform state lock ID to unlock"
        required: true
      environment:
        description: "Environment holding the state to unlock"
        required: true
        type: choice
        options:
          - dev
          - prod
          - platform
      target:
        description: "Target holding the state to unlock"
        required: true
        type: choice
        options:
          - images
          - sandbox
          - talos
          - vault
jobs:
  state_unlock:
    runs-on: ubuntu-latest
    environment: ${{ format('proxmox-{0}-apply', inputs.environment) }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      TF_CLI_ARGS_init: ${{ vars.TF_CLI_ARGS_init }}
    steps:
      - name: Require configured RBAC environment
        env:
          RBAC_READY: ${{ vars.PROXMOX_RBAC_READY }}
        run: test "$RBAC_READY" = true

      - uses: actions/checkout@v3

      - name: Resolve Terraform root
        id: root
        env:
          EVENT_NAME: workflow_dispatch
          DEPLOYMENT_MODE: single
          SELECTED_ENV: ${{ inputs.environment }}
          SELECTED_TARGET: ${{ inputs.target }}
        run: python3 .github/scripts/terraform-roots.py

      - uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: latest

      - name: Initialize Terraform backend
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="key=terraform/${{ inputs.environment }}/${{ inputs.target }}.tfstate"
        working-directory: ./${{ steps.root.outputs.directory }}

      - run: terraform force-unlock -force "${{ inputs.LOCK_ID }}"
        working-directory: ./${{ steps.root.outputs.directory }}
