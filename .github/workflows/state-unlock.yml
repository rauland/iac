name: State Unlock

on:
  workflow_dispatch:
    inputs:
      LOCK_ID:
        description: "Terraform state lock ID to unlock"
        required: true
      environment:
        description: "Environment holding the state to unlock"
        required: true
        type: choice
        options:
          - dev
          - prod
      target:
        description: "Target holding the state to unlock"
        required: true
        type: choice
        options:
          - images
          - k3s
          - sandbox
          - talos
          - vault
jobs:
  state_unlock:
    runs-on: ubuntu-latest
    environment: proxmox-rw
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      TF_CLI_ARGS_init: ${{ vars.TF_CLI_ARGS_init }}
    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: latest

      - name: Initialize Terraform backend
        shell: bash
        run: |
          terraform init -input=false \
            -backend-config="key=terraform/${{ inputs.environment }}/${{ inputs.target }}.tfstate"
        working-directory: ./terraform/environments/${{ inputs.environment }}/${{ inputs.target }}

      - run: terraform force-unlock -force "${{ inputs.LOCK_ID }}"
        working-directory: ./terraform/environments/${{ inputs.environment }}/${{ inputs.target }}
