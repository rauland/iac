---
name: Ansible lint
description: Lint Ansible content with pinned tools and offline inventory
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: ansible/requirements-lint.txt

    - name: Install lint tools
      shell: bash
      run: python -m pip install -r ansible/requirements-lint.txt

    - name: Install Ansible collections
      shell: bash
      env:
        ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible-lint/collections
      run: ansible-galaxy collection install -r ansible/requirements.yml

    - name: Lint Ansible
      shell: bash
      working-directory: ansible
      env:
        ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
        ANSIBLE_INVENTORY: ${{ github.workspace }}/ansible/tests/inventory.yml
        ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/ansible-lint/collections
      run: ansible-lint --offline --strict .
