# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Setup SSH
description: Reusable SSH setup action for GitHub workflows
runs:
  using: "composite"
  steps:
    - name: Configure SSH
      id: configure
      env:
        SSH_PRIVATE_KEY_ANSIBLE: ${{ inputs.SSH_PRIVATE_KEY_ANSIBLE }}
        SSH_ENVIRONMENT: ${{ inputs.environment }}
      run: bash "$GITHUB_WORKSPACE/ssh/setup-ci.sh" setup "$SSH_ENVIRONMENT"
      shell: bash
outputs:
  directory:
    description: "Temporary directory to remove after Ansible completes"
    value: ${{ steps.configure.outputs.directory }}
inputs:
  SSH_PRIVATE_KEY_ANSIBLE:
    description: "SSH private key for Ansible"
    required: true
  environment:
    description: "SSH environment: dev or prod"
    required: true
