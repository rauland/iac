# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Ansible run
description: Reusable Ansible action for GitHub workflows
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/ssh
      id: ssh
      with:
        SSH_PRIVATE_KEY_ANSIBLE: ${{ inputs.SSH_PRIVATE_KEY_ANSIBLE }}
        environment: ${{ inputs.environment }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Ansible & proxmox requirements
      run: |
        pip install ansible "proxmoxer>=2.0" requests netaddr
      shell: bash

    - name: Install Ansible collections
      run: ansible-galaxy collection install -r ./ansible/requirements.yml --force
      shell: bash

    - name: Run Ansible playbook
      working-directory: "${{ inputs.working-directory}}"
      env:
        ANSIBLE_ENVIRONMENT: ${{ inputs.environment }}
        ANSIBLE_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        bash ./run-playbook.sh "$ANSIBLE_ENVIRONMENT" "$ANSIBLE_TARGET" --syntax-check
        bash ./run-playbook.sh "$ANSIBLE_ENVIRONMENT" "$ANSIBLE_TARGET"
      shell: bash

    - name: Remove temporary SSH credentials
      if: always()
      env:
        SSH_DIRECTORY: ${{ steps.ssh.outputs.directory }}
      run: bash "$GITHUB_WORKSPACE/ssh/setup-ci.sh" cleanup "$SSH_DIRECTORY"
      shell: bash

inputs:
  working-directory:
    description: "Working directory for Ansible playbook"
  target:
    description: "Deployment target: managed, sandbox, or vault"
    required: true
  SSH_PRIVATE_KEY_ANSIBLE:
    description: "SSH private key for Ansible"
    required: true
  environment:
    description: "Environment to target"
    required: true
